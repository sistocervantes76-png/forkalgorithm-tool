# Fork Algorithm — Agent Command Center
# Separate Worker from the public recipe site (../wrangler.toml).
name = "fork-command-center"
main = "worker/index.ts"
compatibility_date = "2026-07-13"
compatibility_flags = ["nodejs_compat"]
# Keep variables set in the Cloudflare dashboard (e.g. OWNER_EMAIL) across deploys.
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "fork-command-center"
database_id = "ccd9217d-dac6-4a69-9dca-28a438460da4"
migrations_dir = "migrations"

# Every 15 min: stuck-task recovery, due tasks, and the weekly CEO review, which
# runs on the day/hour/time zone set in Settings (default Friday 16:00 New York).
[triggers]
crons = ["*/15 * * * *"]

[vars]
APP_ENV = "production"
# OWNER_EMAIL is set in the Cloudflare dashboard (Settings → Variables and Secrets)
# or with `wrangler secret put OWNER_EMAIL`. Other secrets: see DEPLOYMENT.md.
